
services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  api:
    build:
      context: ./comandix-backend
      dockerfile: Dockerfile
    restart: always
    # Load .env from the backend folder (DB_PASSWORD, JWT_SECRET, etc.)
    env_file:
      - ./comandix-backend/.env
    environment:
      # Override these so they always use Docker service names, not localhost
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=comandix
      - DB_SYNC=true
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./comandix-backend/.env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=comandix
      # POSTGRES_PASSWORD comes from env_file (DB_PASSWORD)
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
